name: BHA Repository Suggestion Apply Benchmark

on:
  workflow_dispatch:
    inputs:
      project:
        description: Pinned upstream project to test on supported native runners
        type: choice
        options:
          - benchmark
          - mimalloc
          - rocksdb
          - zstd
          - abseil
          - catch2
          - leveldb
          - yaml-cpp
          - libjpeg-turbo
          - glfw
          - redis
          - curl
          - zlib
          - libpng
          - weston
          - all
        default: leveldb
        required: true

permissions:
  contents: read

jobs:
  select-projects:
    name: Select pinned project revisions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_supported: ${{ steps.plan.outputs.has_supported }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify matrix completeness
        run: python3 tests/test_ci_repo_apply_matrix.py
      - name: Build native project/OS matrix
        id: plan
        shell: bash
        env:
          SELECTED_PROJECT: ${{ inputs.project }}
        run: |
          python3 tests/ci_repo_apply_matrix.py "$SELECTED_PROJECT" >> "$GITHUB_OUTPUT"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import sys
          sys.path.insert(0, 'tests')
          from ci_repo_apply_matrix import build_matrix
          plan = build_matrix(os.environ['SELECTED_PROJECT'])
          print('has_supported=' + str(bool(plan['include'])).lower())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Native upstream coverage\n\n')
              summary.write(f"{len(plan['include'])} supported cells; {len(plan['unsupported'])} unsupported cells.\n\n")
              for row in plan['unsupported']:
                  summary.write(f"- {row['project']} / {row['os']}: {row['reason']}\n")
          if not plan['include']:
              raise SystemExit('No supported end-to-end cells exist for the selected project')
          PY

  apply-and-measure:
    name: ${{ matrix.project }} / ${{ matrix.os }}
    needs: select-projects
    if: needs.select-projects.outputs.has_supported == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select-projects.outputs.matrix) }}
    env:
      CMAKE_GENERATOR: Ninja
      BHA_SCRIPT_DIR: ${{ github.workspace }}/cmake
      BUILD_DIR: build-repo-bha
      LLVM_WINDOWS_RELEASE: llvmorg-23.1.1
      LLVM_WINDOWS_ARCHIVE: clang+llvm-23.1.1-x86_64-pc-windows-msvc.tar.zst
      LLVM_WINDOWS_SHA256: c8a12d754b5050c5668b56a5425c806792d46c70f7244b1216046164aa4b6462
    steps:
      - name: Check out BHA
        uses: actions/checkout@v4

      - name: Check out pinned upstream project
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.revision }}
          path: tests/cli/repos/${{ matrix.project }}
          persist-credentials: false

      - name: Verify upstream revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C 'tests/cli/repos/${{ matrix.project }}' rev-parse HEAD)"
          test "$actual" = '${{ matrix.revision }}'
          printf 'Project: %s\nRevision: %s\nRunner: %s\n' \
            '${{ matrix.repository }}' "$actual" "$RUNNER_OS"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Linux compiler and AST dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install --yes clang-18 clang-tools-18 cmake gpg xvfb zlib1g-dev \
            libclang-18-dev libclang-cpp18-dev llvm-18-dev ninja-build \
            nlohmann-json3-dev
          if [[ '${{ matrix.project }}' == glfw ]]; then
            sudo apt-get install --yes libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          fi

      - name: Install VS Code on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euxo pipefail
          curl --fail --silent --show-error https://packages.microsoft.com/keys/microsoft.asc |
            gpg --dearmor | sudo tee /usr/share/keyrings/microsoft-vscode.gpg >/dev/null
          echo 'deb [arch=amd64,arm64,armhf signed-by=/usr/share/keyrings/microsoft-vscode.gpg] https://packages.microsoft.com/repos/code stable main' |
            sudo tee /etc/apt/sources.list.d/vscode.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes code
          printf 'VSCODE_EXECUTABLE=%s\n' "$(command -v code)" >> "$GITHUB_ENV"

      - name: Install macOS AST dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v ninja >/dev/null 2>&1; then brew install ninja; fi
          brew install llvm nlohmann-json
          sdk_root="$(xcrun --show-sdk-path)"
          apple_cc="$(xcrun --find clang)"
          apple_cxx="$(xcrun --find clang++)"
          test -d "$sdk_root"
          test -x "$apple_cc"
          test -x "$apple_cxx"
          printf 'SDKROOT=%s\nBHA_APPLE_CC=%s\nBHA_APPLE_CXX=%s\n' \
            "$sdk_root" "$apple_cc" "$apple_cxx" >> "$GITHUB_ENV"
          printf 'BHA_CLANG_TOOLING_ROOT=%s\n' "$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: Install VS Code on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euxo pipefail
          if ! command -v code >/dev/null 2>&1; then brew install --cask visual-studio-code; fi
          vscode_executable="$(command -v code || true)"
          if [[ -z "$vscode_executable" ]]; then
            app_path="$(mdfind 'kMDItemCFBundleIdentifier == "com.microsoft.VSCode"' | head -n 1)"
            vscode_executable="$app_path/Contents/Resources/app/bin/code"
          fi
          test -x "$vscode_executable"
          printf 'VSCODE_EXECUTABLE=%s\n' "$vscode_executable" >> "$GITHUB_ENV"

      - name: Restore Windows LLVM archive
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\bha-llvm-cache
          key: bha-windows-libtooling-${{ env.LLVM_WINDOWS_RELEASE }}-${{ env.LLVM_WINDOWS_ARCHIVE }}

      - name: Prepare VS 2022 MSVC and Clang LibTooling
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 45
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'ci' | Out-Null
          & .\ci\prepare-windows-toolchain.ps1 `
            -LlvmRelease $env:LLVM_WINDOWS_RELEASE `
            -LlvmArchive $env:LLVM_WINDOWS_ARCHIVE `
            -LlvmSha256 $env:LLVM_WINDOWS_SHA256

      - name: Install Windows LLVM component dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        timeout-minutes: 30
        run: .\ci\install-windows-llvm-dependencies.ps1

      - name: Install Windows JSON dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vcpkg = Join-Path $env:VCPKG_ROOT 'vcpkg.exe'
          $packages = @('nlohmann-json')
          if ('${{ matrix.project }}' -eq 'libpng') { $packages += 'zlib' }
          & $vcpkg install --classic --vcpkg-root $env:VCPKG_ROOT `
            --triplet x64-windows-static @packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install VS Code on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $command = Get-Command code.cmd -ErrorAction SilentlyContinue
          if (-not $command) {
            choco install vscode --yes --no-progress
            $machinePath = [Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
            $env:Path = "$machinePath;$userPath"
            $command = Get-Command code.cmd -ErrorAction SilentlyContinue
          }
          if (-not $command) { throw 'VS Code CLI was not found after installation' }
          "VSCODE_EXECUTABLE=$($command.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Export upstream Windows CMake toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $env:BHA_VCPKG_TOOLCHAIN_FILE)) {
            throw 'The discovered vcpkg CMake toolchain file does not exist'
          }
          "CMAKE_TOOLCHAIN_FILE=$env:BHA_VCPKG_TOOLCHAIN_FILE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lsp/ide-integrations/vscode/package-lock.json

      - name: Build extension
        shell: bash
        working-directory: lsp/ide-integrations/vscode
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run bundle

      - name: Configure BHA on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euxo pipefail
          c_compiler='${{ matrix.c_compiler }}'
          cxx_compiler='${{ matrix.cxx_compiler }}'
          if [[ "$RUNNER_OS" == macOS ]]; then
            c_compiler="$BHA_APPLE_CC"
            cxx_compiler="$BHA_APPLE_CXX"
          fi
          cmake -S . -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_C_COMPILER=$c_compiler" \
            "-DCMAKE_CXX_COMPILER=$cxx_compiler" \
            -DBHA_BUILD_TESTS=OFF -DBHA_BUILD_CLI=ON \
            -DBHA_ENABLE_LSP=ON -DBHA_BUILD_REFACTOR_TOOLS=OFF \
            -DBHA_ENABLE_TEMPLATE_AST=ON -DBHA_REQUIRE_CLANG_TOOLING=ON \
            "-DBHA_CLANG_TOOLING_ROOT=${BHA_CLANG_TOOLING_ROOT:-}"

      - name: Configure BHA with VS 2022 MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S . -B $env:BUILD_DIR -G Ninja `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            "-DCMAKE_TOOLCHAIN_FILE=$env:BHA_VCPKG_TOOLCHAIN_FILE" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DBHA_BUILD_TESTS=OFF -DBHA_BUILD_CLI=ON `
            -DBHA_ENABLE_LSP=ON -DBHA_BUILD_REFACTOR_TOOLS=OFF `
            -DBHA_ENABLE_TEMPLATE_AST=ON -DBHA_REQUIRE_CLANG_TOOLING=ON `
            "-DBHA_CLANG_TOOLING_ROOT=$env:BHA_CLANG_TOOLING_ROOT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build BHA CLI and real LSP
        shell: bash
        run: cmake --build "$BUILD_DIR" --target bha bha-lsp --parallel 2

      - name: Prepare Windows lock-owner diagnostics
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'bha-handle.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'bha-handle'
          Invoke-WebRequest -Uri 'https://download.sysinternals.com/files/Handle.zip' -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $directory -Force
          $handle = Join-Path $directory 'handle64.exe'
          if (-not (Test-Path $handle)) { throw 'Sysinternals Handle executable was not found' }
          "BHA_HANDLE_EXE=$handle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify benchmark harness behavior
        shell: bash
        run: python tests/test_repo_apply_benchmark.py

      - name: Capture, analyze, apply in VS Code, rebuild, and test upstream project
        shell: bash
        timeout-minutes: 100
        run: |
          set -euxo pipefail
          bha_path="$BUILD_DIR/bha"
          lsp_path="$BUILD_DIR/lsp/bha-lsp"
          if [[ "$RUNNER_OS" == Windows ]]; then bha_path+=.exe; lsp_path+=.exe; fi
          host_prefix=''
          if [[ "$RUNNER_OS" == Linux ]]; then host_prefix='xvfb-run --auto-servernum'; fi
          c_compiler='${{ matrix.c_compiler }}'
          cxx_compiler='${{ matrix.cxx_compiler }}'
          if [[ "$RUNNER_OS" == macOS ]]; then
            c_compiler="$BHA_APPLE_CC"
            cxx_compiler="$BHA_APPLE_CXX"
          fi
          benchmark_args=(
            --project '${{ matrix.project }}'
            --bha-path "$bha_path"
            --lsp-path "$lsp_path" --apply-mode vscode --ci-profile
            --host-prefix "$host_prefix"
            --c-compiler "$c_compiler"
            --cxx-compiler "$cxx_compiler"
            --jobs 2 --runs 1 --timeout-seconds 2400
            --analysis-timeout-seconds 900 --require-applied
          )
          if [[ '${{ matrix.require_tests }}' == true ]]; then benchmark_args+=(--require-tests); fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            benchmark_args+=(--cmake-arg=-DVCPKG_TARGET_TRIPLET=x64-windows-static)
            if [[ '${{ matrix.project }}' == rocksdb ]]; then
              benchmark_args+=(--cmake-arg=-DWIN_CI=ON)
            fi
          fi
          python tests/run_repo_apply_benchmark.py "${benchmark_args[@]}"

      - name: Publish result summary
        if: always()
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          from pathlib import Path
          for summary in sorted(Path('tests/cli/benchmarks').glob('*/summary.md')):
              print(summary.read_text(encoding='utf-8'))
          PY

      - name: Upload benchmark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-apply-${{ matrix.project }}-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            tests/cli/benchmarks/**/summary.json
            tests/cli/benchmarks/**/summary.md
            tests/cli/benchmarks/**/result.json
            tests/cli/benchmarks/**/vscode-apply-result.json
            tests/cli/benchmarks/**/logs/*.log
